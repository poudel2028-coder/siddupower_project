<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>SideStack</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <div id="toast" class="toast hidden" role="status"></div>

    <section id="view-auth" class="screen">
      <header class="brand">
        <p class="eyebrow">Friends. Stats. Chaos.</p>
        <h1>SideStack</h1>
        <p class="lede">Live sports tracking for pickup games. Basketball or football. Mobile-first. Ref-ready.</p>
      </header>
      <div class="glass auth-card">
        <div class="segmented" role="tablist">
          <button id="tab-login" class="seg active" type="button">Sign in</button>
          <button id="tab-register" class="seg" type="button">Create account</button>
        </div>
        <form id="form-login" class="stack">
          <label>Username<input name="username" autocomplete="username" required /></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
          <button class="btn primary" type="submit">Enter the court</button>
        </form>
        <form id="form-register" class="stack hidden">
          <label>Username<input name="username" autocomplete="username" minlength="3" required /></label>
          <label>Password<input name="password" type="password" autocomplete="new-password" minlength="6" required /></label>
          <label>
            Primary sport
            <select name="primary_sport" id="primary-sport" required>
              <option value="basketball">Basketball</option>
              <option value="football">Football</option>
              <option value="cricket">Cricket</option>
            </select>
          </label>
          <button class="btn primary" type="submit">Create account</button>
        </form>
      </div>
    </section>

    <div id="cricket-modal" class="modal hidden" role="alertdialog" aria-modal="true">
      <div class="glass modal-card cricket">
        <p class="badge">Easter egg</p>
        <h2>Absolutely not.</h2>
        <p>
          Cricket matches take 5 days. We don’t have the server space, the tea budget, or the emotional bandwidth.
          Pick a real sport.
        </p>
        <button id="cricket-dismiss" class="btn primary" type="button">Fine, I’ll pick hoop or boot</button>
      </div>
    </div>

    <section id="view-app" class="screen hidden">
      <header class="topbar glass">
        <div>
          <p class="eyebrow" id="hello">Hey</p>
          <h1 id="app-title">Home</h1>
        </div>
        <button id="btn-logout" class="btn ghost" type="button">Out</button>
      </header>

      <main id="pages" class="pages">
        <div id="page-home" class="page"></div>
        <div id="page-friends" class="page hidden"></div>
        <div id="page-teams" class="page hidden"></div>
        <div id="page-matches" class="page hidden"></div>
        <div id="page-profile" class="page hidden"></div>
        <div id="page-board" class="page hidden"></div>
        <div id="page-ref" class="page hidden"></div>
      </main>

      <nav class="tabbar glass" aria-label="Primary">
        <button data-page="home" class="tab active" type="button">Home</button>
        <button data-page="friends" class="tab" type="button">Friends</button>
        <button data-page="teams" class="tab" type="button">Teams</button>
        <button data-page="matches" class="tab" type="button">Games</button>
      </nav>
    </section>

    <script src="/js/app.js"></script>
  </body>
</html>
